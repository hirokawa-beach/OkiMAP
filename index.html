<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OkiMAP(leafletテスト版)</title>
  <!-- Leaflet の CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div class="panel" id="controlPanel">
    <strong>タイル表示設定</strong>
    <label>
      タイル URL テンプレート
      <input type="text" id="tileUrl" value="img/tiles/{z}/{x}/{y}.png" />
    </label>

    <div class="row">
      <div style="flex:1">
        <label>元画像幅 (px)
          <input type="number" id="imgW" value="9000" min="1" />
        </label>
      </div>
      <div style="flex:1">
        <label>元画像高さ (px)
          <input type="number" id="imgH" value="9000" min="1" />
        </label>
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label>タイルサイズ (px)
          <input type="number" id="tileSize" value="256" min="16" />
        </label>
      </div>
      <div style="flex:1">
        <label>ネイティブ max (生成済み)
          <input type="number" id="nativeMax" value="7" min="0" />
        </label>
      </div>
    </div>

    <label>
      表示上の maxZoom (もっと拡大したければ大きく)
      <input type="number" id="displayMax" value="12" min="0" />
    </label>

    <div class="row">
      <label style="flex:0.2">
        zoomSnap (刻み)
        <select id="zoomSnap">
          <option value="1">1 (整数)</option>
          <option value="0.5">0.5</option>
          <option value="0.25">0.25</option>
          <option value="0.1">0.1</option>
        </select>
      </label>
      <label style="flex:1">
        表示法
        <select id="renderMode">
          <option value="smooth">滑らか（default）</option>
          <option value="pixel">ピクセル拡大（pixelated）</option>
        </select>
      </label>
    </div>

    <div class="row">
      <button id="applyBtn">設定を適用</button>
      <button id="fitBtn">全体表示 (fitBounds)</button>
    </div>

    <label style="margin-top:8px">
      <input type="checkbox" id="pixelPickerToggle" /> ピクセル選択モードを有効にする
    </label>

    <label style="margin-top:6px">
      <input type="checkbox" id="pixelGridToggle" /> ピクセルグリッドを表示 (ネイティブズーム基準、表示は zoom ≥ 8 のときのみ)
    </label>

    <label style="margin-top:6px">
      <input type="checkbox" id="colorizeToggle" /> ピクセル色でオーバーレイ（Colorize、表示は zoom ≥ 8 のときのみ）
    </label>

    <div class="row" style="margin-top:6px;">
      <label style="flex:1">サンプリング step (1 = 全ピクセル、2 = 2pxごと...)<input type="number" id="sampleStep" value="1" min="1" style="width:80px; margin-left:6px;" /></label>
      <label style="flex:1">不透明度 <input type="range" id="overlayOpacity" min="0" max="1" step="0.05" value="1.0" /></label>
    </div>

    <label style="margin-top:6px">
      最小スクリーン間隔 (px)。グリッド/オーバーレイの間引き閾値:
      <input type="number" id="gridMinScreen" value="1" min="1" style="width:70px; display:inline-block; margin-left:8px;" />
    </label>

    <div id="pixelOutput" class="pixel-box" style="display:none;">
      <div class="color-swatch" id="colorSwatch"></div>
      <div class="pixel-text" id="pixelText">pixel: --, --<br>RGBA: --</div>
      <button id="copyColor" class="small-btn">HEXをコピー</button>
      <button id="clearCache" class="small-btn">タイルキャッシュクリア</button>
    </div>

    <div class="hint">
      - オーバーレイとグリッドはデフォルトで zoom ≥ 8 の時のみ描画されます。閾値を変えたい場合はコード内の MIN_ZOOM_TO_SHOW を調整してください。<br>
      - tiles が別ドメインの場合は CORS ヘッダが必要です。
    </div>
  </div>

  <div class="zoom-info" id="zoomInfo">zoom: --</div>
  <div class="coords" id="coordsInfo">pixel: -- , --</div>

  <!-- オーバーレイ用キャンバス -->
  <canvas id="pixelGridCanvas"></canvas>
  <div id="pixelMarker" class="pixel-marker" style="display:none"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
