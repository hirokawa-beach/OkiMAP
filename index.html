<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OkiMAP(leafletテスト版)</title>
  <!-- Leaflet の CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- 設定ボタン -->
  <button id="settingsBtn" class="small-btn" aria-haspopup="dialog" aria-expanded="false" title="設定">⚙️</button>

  <div class="panel hidden" id="controlPanel" role="dialog" aria-modal="true" aria-label="表示設定">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong>表示設定</strong>
      <span class="hint" style="font-size:12px; color:#666;">閉じるには右上の⚙️をもう一度押してください</span>
    </div>

    <div style="margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <div class="pill">タイルサイズ: 256px</div>
      <div class="pill">ネイティブ max: 7</div>
      <div class="pill">表示上 maxZoom: 12</div>
      <div class="pill">表示法: 滑らか</div>
    </div>

    <div class="row" style="margin-top:12px;">
      <label style="flex:0.5">
        zoomSnap
        <select id="zoomSnap">
          <option value="1">1</option>
          <option value="0.5">0.5</option>
          <option value="0.25">0.25</option>
          <option value="0.1">0.1</option>
        </select>
      </label>

      <label style="flex:1; display:flex; gap:8px; align-items:center;">
        <input type="checkbox" id="pixelPickerToggle" /> ピクセル選択モード
      </label>
    </div>

    <label style="margin-top:8px; display:flex; gap:8px; align-items:center;">
      <input type="checkbox" id="pixelGridToggle" /> ピクセルグリッドを表示（zoom ≥ 8 のとき）
    </label>

    <label style="margin-top:6px; display:flex; gap:8px; align-items:center;">
      <input type="checkbox" id="colorizeToggle" /> ピクセル色でオーバーレイ（zoom ≥ 8 のとき）
    </label>

    <div class="row" style="margin-top:8px;">
      <label style="flex:1">サンプリング step<input type="number" id="sampleStep" value="1" min="1" style="width:80px; margin-left:6px;" /></label>
      <label style="flex:1">不透明度 <input type="range" id="overlayOpacity" min="0" max="1" step="0.05" value="1.0" /></label>
    </div>

    <label style="margin-top:8px">
      最小スクリーン間隔 (px)
      <input type="number" id="gridMinScreen" value="1" min="1" style="width:80px; margin-left:8px;" />
    </label>

    <div class="row" style="margin-top:12px;">
      <button id="applyBtn">設定を適用</button>
      <button id="fitBtn">全体表示</button>
    </div>

    <div class="hint" style="margin-top:12px;">
      - オーバーレイ／グリッドは zoom ≥ 8 のとき描画します。<br>
    </div>
  </div>

  <!-- 画面中央下：日付バー（両隣に日付操作ボタン） -->
  <div id="dateBar" aria-label="日付選択バー">
    <button id="prevDate" class="date-btn" title="前日">◀</button>
    <input type="date" id="dateInput" />
    <span id="timeLabel" class="time-label">--:--</span>
    <button id="nextDate" class="date-btn" title="翌日">▶</button>
  </div>

  <!-- ピクセル情報（設定ダイアログの外） -->
  <div id="pixelOutput" class="pixel-box" style="display:none;">
    <div class="color-swatch" id="colorSwatch"></div>
    <div class="pixel-text" id="pixelText">pixel: --, --<br>RGBA: --</div>
    <button id="copyColor" class="small-btn">HEXをコピー</button>
    <button id="clearCache" class="small-btn">キャッシュクリア</button>
  </div>

  <div class="zoom-info" id="zoomInfo">zoom: --</div>
  <div class="coords" id="coordsInfo">pixel: -- , --</div>

  <!-- オーバーレイ用キャンバス -->
  <canvas id="pixelGridCanvas"></canvas>
  <div id="pixelMarker" class="pixel-marker" style="display:none"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
